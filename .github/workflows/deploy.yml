# ──────────────────────────────────────────────────────────────────────────────
# Deploy – cdk deploy --all, then build + publish the frontend.
#
# Triggers on every push to main. Uses GitHub OIDC to assume an AWS IAM role
# (see docs/adr/0006-github-oidc-deploy-credentials.md) -- no long-lived AWS
# access keys are stored as secrets.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   AWS_DEPLOY_ROLE_ARN   IAM role ARN this workflow assumes via OIDC
#   ADMIN_ALERT_EMAIL     Receives CloudWatch alarm / AWS Budgets notifications
#   SES_SENDER_EMAIL      "From" address for attendee confirmation emails
#
# Required GitHub variable (optional, defaults to us-east-1):
#   AWS_REGION
#
# See docs/deployment.md for the one-time AWS + GitHub setup steps.
# ──────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC token exchange
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-progress deployment

jobs:
  deploy:
    name: cdk deploy + publish frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy (cdk deploy + frontend build/sync/invalidate)
        env:
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          SES_SENDER_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: ./scripts/deploy.sh
