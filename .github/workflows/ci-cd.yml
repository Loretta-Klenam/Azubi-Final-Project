# ──────────────────────────────────────────────────────────────────────────────
# CI – Test, Lint, Terraform Validate/Plan
#
# Runs on every push and pull request.
# This workflow only checks; it never deploys.
# Deployment is handled by deploy.yml.
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write      # needed for OIDC plan preview on PRs
  pull-requests: write # needed to post plan comments

jobs:
  # ────────────────────────────────────────────────────────
  # 1. Build & Test (frontend + backend)
  # ────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (frontend + backend)
        run: npm run build

      - name: Run tests (frontend + backend)
        run: npm run test

  # ────────────────────────────────────────────────────────
  # 2. Terraform fmt + validate (no AWS creds needed)
  # ────────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      # archive_file reads this file at plan time; create a placeholder so
      # validate does not complain about a missing provider-required file.
      - name: Create Lambda dist placeholder
        run: mkdir -p backend/dist && echo '{}' > backend/dist/index.js

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (offline — no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

  # ────────────────────────────────────────────────────────
  # 3. Terraform plan preview — only on pull requests
  #    Posts plan diff as a PR comment.
  #    Requires AWS_ROLE_ARN (or AWS_ACCESS_KEY_ID) secret.
  # ────────────────────────────────────────────────────────
  terraform-plan-preview:
    name: Terraform plan (PR preview)
    runs-on: ubuntu-latest
    needs: terraform-validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Create Lambda dist placeholder
        run: mkdir -p backend/dist && echo '{}' > backend/dist/index.js

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=event-ticketing/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        id: plan
        run: |
          terraform -chdir=terraform plan \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -no-color 2>&1 | tee /tmp/plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n...plan truncated (> 60 KB)'
              : plan;
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const icon = exitCode === '0' ? '✅' : '❌';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `### ${icon} Terraform Plan — \`dev\``,
                '<details><summary>Show plan</summary>',
                '',
                '```terraform',
                truncated,
                '```',
                '</details>',
              ].join('\n'),
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exit_code != '0'
        run: exit 1
