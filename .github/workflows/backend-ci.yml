# ──────────────────────────────────────────────────────────────────────────────
# Backend CI – lint + unit tests for the Lambda handlers (backend/).
# Runs on every push and pull request that touches backend/. No AWS access
# needed (unit tests use moto to mock DynamoDB/S3/SNS/SES).
# ──────────────────────────────────────────────────────────────────────────────
name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests (pytest + moto)
        run: pytest -q
