# ──────────────────────────────────────────────────────────────────────────────
# Frontend CI – lint + type-check + build + unit tests (frontend/).
# Runs on every push and pull request that touches frontend/. No AWS access
# needed; the real API/Cognito values are only injected at deploy time.
# ──────────────────────────────────────────────────────────────────────────────
name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Run unit tests (vitest)
        run: npm run test
